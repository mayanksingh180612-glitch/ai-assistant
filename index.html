
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayank AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:900px;min-height:100vh;display:flex;flex-direction:column;padding:20px}
header{padding:18px 0;border-bottom:1px solid #283149}
h1{margin:0;font-size:27px;background:linear-gradient(90deg,#69e5ff,#b99cff);color:transparent;background-clip:text}
header p{color:#9daac5;margin:8px 0 0}
#chat{flex:1;padding:20px 0;display:flex;flex-direction:column;gap:15px}
.msg{padding:14px 17px;border-radius:16px;max-width:90%;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#5145cd}
.bot{align-self:flex-start;background:#182239;border:1px solid #2b3854}
.welcome{color:#bdc9df;text-align:center;margin:auto;line-height:1.8}
form{position:sticky;bottom:0;background:#0b1020;padding:12px 0 8px}
.row{display:flex;gap:10px}
textarea{flex:1;resize:vertical;min-height:55px;max-height:180px;background:#151f33;color:white;border:1px solid #34415c;border-radius:14px;padding:16px;font:inherit;outline:none}
button{border:0;border-radius:13px;background:#7566ff;color:white;padding:0 20px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.note{font-size:12px;color:#8997b2;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
<header>
<h1>✦ Mayank AI</h1>
<p>Your AI assistant · Ask anything</p>
</header>

<main id="chat">
<div class="welcome">
<h2>Hey Mayank! 👋</h2>
Ask me anything. I'm ready to help you.
</div>
</main>

<form id="form">
<div class="row">
<textarea id="prompt" placeholder="Message Mayank AI..." required></textarea>
<button id="send" type="submit">Send ➤</button>
</div>
<p class="note">Mayank AI · Powered by Groq · Enter to send, Shift+Enter for a new line</p>
</form>
</div>

<script>
const GROQ_API_KEY = "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";
const API_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "llama-3.3-70b-versatile";

const form = document.getElementById("form");
const promptBox = document.getElementById("prompt");
const chat = document.getElementById("chat");
const send = document.getElementById("send");

const history = [{
  role: "system",
  content: "You are Mayank AI, a friendly and helpful assistant. Answer clearly. Reply in the language the user uses."
}];

function addMessage(text, role) {
  const welcome = chat.querySelector(".welcome");
  if (welcome) welcome.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

async function askAI(text, bubble) {
  if (!GROQ_API_KEY || GROQ_API_KEY === "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") {
    bubble.textContent = "Pehle code mein YOUR_GROQ_API_KEY ki jagah apni Groq API key paste karo.";
    return;
  }

  history.push({role:"user", content:text});

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: MODEL,
        messages: history,
        temperature: 0.7,
        max_tokens: 1024
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "API request failed: " + response.status);
    }

    const answer = data.choices?.[0]?.message?.content || "No answer received.";
    history.push({role:"assistant", content:answer});
    bubble.textContent = answer;
  } catch (error) {
    bubble.textContent = "Error: " + error.message +
      "\n\nAPI key, internet connection aur Groq API access check karo.";
    history.pop();
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = promptBox.value.trim();
  if (!text || send.disabled) return;

  addMessage(text, "user");
  promptBox.value = "";
  send.disabled = true;
  send.textContent = "...";

  const bubble = addMessage("Thinking... ✨", "bot");
  await askAI(text, bubble);

  send.disabled = false;
  send.textContent = "Send ➤";
  promptBox.focus();
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
